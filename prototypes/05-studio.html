<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio — plan a forest of Story Bookcases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #121014; --panel: #1B181F; --line: #2C2832; --text: #ECE8F1; --muted: #8C8597; --cyan: #99EEFF; --mag: #BB22AA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 'Inter Tight', system-ui, sans-serif; display: grid; grid-template-columns: minmax(0, 1fr) 380px; overflow: hidden; }
  .stage { position: relative; overflow: hidden; cursor: grab; background: radial-gradient(ellipse at 50% 70%, #2A2430 0%, #121014 65%); touch-action: none; user-select: none; }
  .stage.drag { cursor: grabbing; }
  .scene { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 35%; }
  .world { position: absolute; left: 50%; top: 78%; transform-style: preserve-3d; }
  .world div { position: absolute; left: 0; top: 0; transform-style: preserve-3d; backface-visibility: hidden; }
  .world .f { box-shadow: inset 0 0 0 0.5px #00000040; }
  .world .f.sel { box-shadow: inset 0 0 0 1.5px var(--cyan), 0 0 14px var(--cyan); }
  .floor { background: radial-gradient(circle, #ffffff10 0, #ffffff06 40%, transparent 70%); border-radius: 50%; }
  .hud { position: absolute; left: 22px; top: 20px; right: 22px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .hud h1 { margin: 0; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
  .hud h1 span { color: var(--cyan); }
  .hud p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .views { display: flex; gap: 6px; pointer-events: auto; }
  .btn { background: #ffffff0d; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 12px; font: 500 13px 'Inter Tight', sans-serif; cursor: pointer; }
  .btn:hover { background: #ffffff1a; }
  .btn.primary { background: var(--cyan); color: #0C1A1F; border-color: var(--cyan); font-weight: 600; }
  .btn[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
  .legend { position: absolute; left: 22px; bottom: 18px; color: var(--muted); font-size: 12px; }

  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sec { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .sec h2 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .units { display: flex; gap: 8px; flex-wrap: wrap; }
  .unit-tab { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; border: 1px solid var(--line); background: none; color: var(--text); cursor: pointer; font: 500 13px 'Inter Tight', sans-serif; }
  .unit-tab i { width: 18px; height: 18px; border-radius: 5px; border: 1px solid #ffffff22; }
  .unit-tab[aria-pressed="true"] { border-color: var(--cyan); background: #99EEFF12; }
  .row2 { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .seg { display: flex; background: #00000033; border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: 500 13px 'Inter Tight', sans-serif; }
  .seg button[aria-pressed="true"] { background: #ffffff14; color: var(--text); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; position: relative; }
  .sw[aria-pressed="true"] { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--panel) inset; }
  .sw:hover::after { content: attr(data-name); position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #000; padding: 3px 7px; border-radius: 6px; font-size: 11px; white-space: nowrap; color: #fff; }
  .picker { width: 34px; height: 34px; border-radius: 50%; border: 1px dashed var(--muted); padding: 0; background: none; cursor: pointer; overflow: hidden; }
  .picker::-webkit-color-swatch-wrapper { padding: 0; } .picker::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .colorname { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .shelves { flex: 1; overflow: auto; padding: 8px 18px 16px; }
  .shelf { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 10px; }
  .shelf.sel { background: #99EEFF14; }
  .shelf .n { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .shelf.sel .n { color: var(--cyan); }
  .dirs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .dirs button { background: #00000033; border: 1px solid transparent; border-radius: 8px; padding: 3px 0 2px; cursor: pointer; color: var(--muted); font: 500 10px 'Inter Tight', sans-serif; display: flex; flex-direction: column; align-items: center; }
  .dirs button[aria-pressed="true"] { border-color: var(--cyan); color: var(--text); background: #99EEFF10; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets .btn { padding: 5px 9px; font-size: 12px; }
  .foot { padding: 14px 18px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
  .foot .btn { flex: 1; }
  .toast { position: fixed; left: calc(50% - 190px); bottom: 26px; transform: translateX(-50%); background: var(--cyan); color: #0C1A1F; padding: 8px 14px; border-radius: 10px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; max-width: 50vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast.show { opacity: 1; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; overflow: auto; } aside { border-left: 0; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="scene"><div class="world" id="world"></div></div>
  <div class="hud">
    <div><h1>Story <span>Studio</span></h1><p>Drag to orbit · click a shelf to select it · <b>R</b> rotates it</p></div>
    <div class="views" id="views"></div>
  </div>
  <div class="legend">Front of the room faces you in the “Front” view. Colors sampled from Herman Miller product photos.</div>
</div>

<aside>
  <div class="sec">
    <h2>Bookcases <button class="btn" id="add">+ Add</button></h2>
    <div class="units" id="units"></div>
    <div class="row2">
      <div class="seg" id="size"></div>
      <button class="btn" id="remove">Remove</button>
    </div>
  </div>
  <div class="sec">
    <h2>Finish</h2>
    <div class="swatches" id="swatches"></div>
    <div class="colorname" id="colorname"></div>
  </div>
  <div class="sec">
    <h2>Pattern</h2>
    <div class="presets" id="presets"></div>
  </div>
  <div class="shelves" id="shelves"></div>
  <div class="foot">
    <button class="btn" id="share">Copy link</button>
    <button class="btn primary" id="print">Print build sheets</button>
  </div>
</aside>
<div class="toast" id="toast"></div>
<script src="shared/story-core.js"></script>
<script>
  const S = Story;
  const G = S.GEO;
  const MAX_UNITS = 4;
  const SPACING = 22;
  let units = S.readHash();
  if (!units.length) units = [S.createState('tall', '#6E4C42', S.PRESETS[3].make(11)), S.createState('standard', '#E2B062', S.PRESETS[1].make(9))];
  let cur = 0;
  let sel = -1;
  let yaw = -28;
  let tilt = -14;
  const $ = (id) => document.getElementById(id);
  const VIEWS = [{ name: 'Front', yaw: 0, tilt: -6 }, { name: 'Corner', yaw: -35, tilt: -16 }, { name: 'Side', yaw: -90, tilt: -6 }, { name: 'Top', yaw: 0, tilt: -88 }];

  function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2300); }

  function px() { return Math.max(3, Math.min(9, ($('stage').clientHeight * 0.62) / S.SIZES.tall.height)); }

  function face(parent, w, h, tf, bg, data) {
    const d = document.createElement('div');
    d.className = 'f';
    d.style.cssText = `width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;transform:${tf};background:${bg}`;
    if (data) Object.assign(d.dataset, data);
    parent.appendChild(d);
    return d;
  }

  function box(parent, b, color, k, data) {
    const w = (b.x1 - b.x0) * k, h = (b.y1 - b.y0) * k, dz = (b.z1 - b.z0) * k;
    const cx = ((b.x0 + b.x1) / 2) * k, cy = -((b.y0 + b.y1) / 2) * k, cz = ((b.z0 + b.z1) / 2) * k;
    const faces = [
      face(parent, w, dz, `translate3d(${cx}px,${-b.y1 * k}px,${cz}px) rotateX(90deg)`, S.shade(color, 0.12), data),
      face(parent, w, dz, `translate3d(${cx}px,${-b.y0 * k}px,${cz}px) rotateX(-90deg)`, S.shade(color, -0.4), data),
      face(parent, w, h, `translate3d(${cx}px,${cy}px,${b.z1 * k}px)`, color, data),
      face(parent, w, h, `translate3d(${cx}px,${cy}px,${b.z0 * k}px) rotateY(180deg)`, S.shade(color, -0.28), data),
      face(parent, dz, h, `translate3d(${b.x1 * k}px,${cy}px,${cz}px) rotateY(90deg)`, S.shade(color, -0.14), data),
      face(parent, dz, h, `translate3d(${b.x0 * k}px,${cy}px,${cz}px) rotateY(-90deg)`, S.shade(color, -0.2), data),
    ];
    return faces;
  }

  function renderScene() {
    const k = px();
    const world = $('world');
    world.innerHTML = '';
    world.style.transform = `rotateX(${tilt}deg) rotateY(${yaw}deg)`;
    const span = (units.length - 1) * SPACING + 40;
    face(world, span * k, 40 * k, 'rotateX(90deg)', '', null).className = 'floor';
    units.forEach((u, ui) => {
      const g = document.createElement('div');
      g.style.transform = `translateX(${(ui - (units.length - 1) / 2) * SPACING * k}px)`;
      world.appendChild(g);
      const b = G.base / 2, c = G.col / 2;
      const H = S.SIZES[u.size].height;
      box(g, { x0: -b, x1: b, y0: 0, y1: G.baseH, z0: -b, z1: b }, u.color, k, { u: ui });
      box(g, { x0: -c, x1: c, y0: G.baseH, y1: H, z0: -c, z1: c }, u.color, k, { u: ui });
      S.shelfHeights(u.size).forEach((h, i) => {
        const f = S.footprint(u.dirs[i]);
        const faces = box(g, { x0: f.x0, x1: f.x1, y0: h - G.shelfT, y1: h, z0: f.z0, z1: f.z1 }, u.color, k, { u: ui, i });
        if (ui === cur && i === sel) faces.forEach((el) => el.classList.add('sel'));
      });
    });
  }

  function renderPanel() {
    const u = units[cur];
    $('units').innerHTML = units.map((x, i) => `<button class="unit-tab" data-u="${i}" aria-pressed="${i === cur}"><i style="background:${x.color}"></i>${i + 1} · ${S.SIZES[x.size].label}</button>`).join('');
    $('add').disabled = units.length >= MAX_UNITS;
    $('remove').disabled = units.length <= 1;
    document.querySelectorAll('#size button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.size === u.size));
    document.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', b.dataset.hex.toLowerCase() === u.color.toLowerCase()));
    $('picker').value = u.color;
    $('colorname').textContent = S.isCatalogColor(u.color) ? `${S.colorName(u.color)} — Herman Miller finish` : `Custom ${u.color} — not a Herman Miller finish`;
    const rows = u.dirs.map((d, i) => ({ d, i })).reverse();
    $('shelves').innerHTML = `<h2 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:8px 0">Shelves · bookcase ${cur + 1} · top to bottom</h2>` +
      rows.map(({ d, i }) => `<div class="shelf ${i === sel ? 'sel' : ''}" data-i="${i}"><span class="n">${i + 1}</span><div class="dirs">${S.DIRS.map((x) =>
        `<button data-dir="${x}" aria-pressed="${x === d}" title="${S.DIR_LABEL[x]}">${S.planGlyph(x, x === d ? '#99EEFF' : '#8C8597', 18)}${S.DIR_LABEL[x]}</button>`).join('')}</div></div>`).join('');
  }

  function update() {
    S.writeHash(units);
    renderScene();
    renderPanel();
  }

  $('views').innerHTML = VIEWS.map((v, i) => `<button class="btn" data-v="${i}">${v.name}</button>`).join('');
  $('views').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; const v = VIEWS[+b.dataset.v]; yaw = v.yaw; tilt = v.tilt; renderScene(); };
  $('size').innerHTML = Object.values(S.SIZES).map((s) => `<button data-size="${s.id}">${s.label}</button>`).join('');
  $('size').onclick = (e) => { const b = e.target.closest('button'); if (b) { units[cur] = S.resize(units[cur], b.dataset.size); sel = -1; update(); } };
  $('swatches').innerHTML = S.COLORS.map((c) => `<button class="sw" data-hex="${c.hex}" data-name="${c.name}" style="background:${c.hex}" aria-label="${c.name}"></button>`).join('') +
    '<input type="color" class="picker" id="picker" title="Custom color">';
  $('swatches').onclick = (e) => { const b = e.target.closest('.sw'); if (b) { units[cur].color = b.dataset.hex; update(); } };
  $('picker').oninput = (e) => { units[cur].color = e.target.value.toUpperCase(); update(); };
  $('presets').innerHTML = S.PRESETS.map((p) => `<button class="btn" data-p="${p.id}">${p.name}</button>`).join('');
  $('presets').onclick = (e) => { const b = e.target.closest('button'); if (b) { units[cur].dirs = S.PRESETS.find((p) => p.id === b.dataset.p).make(units[cur].dirs.length); update(); } };
  $('units').onclick = (e) => { const b = e.target.closest('.unit-tab'); if (b) { cur = +b.dataset.u; sel = -1; update(); } };
  $('add').onclick = () => {
    if (units.length >= MAX_UNITS) return;
    const last = units[units.length - 1];
    units.push(S.createState(last.size === 'tall' ? 'standard' : 'tall', last.color));
    cur = units.length - 1; sel = -1; update();
  };
  $('remove').onclick = () => { if (units.length > 1) { units.splice(cur, 1); cur = Math.max(0, cur - 1); sel = -1; update(); } };
  $('shelves').onclick = (e) => {
    const row = e.target.closest('.shelf');
    if (!row) return;
    sel = +row.dataset.i;
    const b = e.target.closest('button[data-dir]');
    if (b) units[cur].dirs[sel] = b.dataset.dir;
    update();
  };
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || sel < 0) return;
    if (e.key === 'r' || e.key === 'R') { units[cur].dirs[sel] = S.rotate(units[cur].dirs[sel], e.shiftKey ? -1 : 1); update(); }
  });

  let drag = null;
  $('stage').addEventListener('pointerdown', (e) => {
    if (e.target.closest('.views')) return;
    drag = { x: e.clientX, y: e.clientY, yaw, tilt, moved: false, target: e.target };
    $('stage').classList.add('drag');
    $('stage').setPointerCapture(e.pointerId);
  });
  $('stage').addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
    yaw = drag.yaw + dx * 0.4;
    tilt = Math.max(-88, Math.min(-2, drag.tilt - dy * 0.3));
    $('world').style.transform = `rotateX(${tilt}deg) rotateY(${yaw}deg)`;
  });
  $('stage').addEventListener('pointerup', () => {
    if (drag && !drag.moved) {
      const f = drag.target.closest('.f');
      if (f && f.dataset.u !== undefined) {
        cur = +f.dataset.u;
        sel = f.dataset.i !== undefined ? +f.dataset.i : -1;
        update();
      }
    }
    drag = null;
    $('stage').classList.remove('drag');
  });
  window.addEventListener('resize', renderScene);

  $('share').onclick = async () => { const r = await S.share(units); toast(r.copied ? 'Link copied — includes every bookcase' : r.url); };
  $('print').onclick = () => S.printBuildSheet(units);
  update();
</script>
</body>
</html>
